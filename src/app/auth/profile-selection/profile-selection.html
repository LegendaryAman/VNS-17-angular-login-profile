<div>
  <h2>Select Your Profile</h2>
  <div *ngFor="let profile of profiles">
    <button
      (click)="selectProfile(profile)"
      (keyup.enter)="selectProfile(profile)"
      (keyup.space)="selectProfile(profile)"
      tabindex="0"
    >
      {{ isDefault(profile) ? '❤️' : '🤍' }} {{ profile }}
    </button>
  </div>
  <button (click)="confirmSelection()" (keyup.enter)="confirmSelection()" tabindex="0" [disabled]="!selectedProfile">
    Confirm
  </button>
</div>
