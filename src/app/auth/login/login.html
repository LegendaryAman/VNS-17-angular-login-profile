
<div class="login-container">
  <div class="login-card">
    <img src="assets/images/sec1.png" alt="Company Logo" class="logo" />
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <label>Email</label>
      <input formControlName="email" type="email" placeholder="Enter your email" autocomplete="username" />
      
      <label>Password</label>
      <input formControlName="password" type="password" placeholder="Enter your password" autocomplete="current-password" />
      
      <a href="#" (click)="onForgotPassword($event)" class="forgot">Forgot password?</a>
      
      <button type="submit" [disabled]="!loginForm.valid" class="login-btn">Log in</button>
      
      <div class="divider">OR</div>
      
      <button type="button" (click)="onSSOLogin()" class="sso-btn">Log in with SSO</button>
      
      <div class="supported">
        <p>Supported By</p>
        <img src="" alt="Support Logo" />
      </div>
    </form>
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
  </div>
</div>
